name: release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Docs-only changes don't ship to users and owe no version bump.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'backend/tests/**'

permissions:
  contents: read

env:
  VERSION_FILE: pyproject.toml

jobs:
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version must advance
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"

          if git cat-file -e "FETCH_HEAD:$VERSION_FILE" 2>/dev/null; then
            old=$(git show "FETCH_HEAD:$VERSION_FILE" | grep -m1 '^version' | sed -E 's/version *= *"([^"]+)"/\1/')
          else
            echo "$VERSION_FILE does not exist on $BASE; treating as introduced by this PR."
            old=""
          fi
          new=$(grep -m1 '^version' "$VERSION_FILE" | sed -E 's/version *= *"([^"]+)"/\1/')

          if [ -z "$old" ]; then
            echo "$VERSION_FILE newly added at $new"
          elif [ "$old" = "$new" ]; then
            echo "::error::$VERSION_FILE version is still $old - bump it."
            exit 1
          elif [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | head -1)" != "$old" ]; then
            echo "::error::$new does not advance past $old."
            exit 1
          else
            echo "$old -> $new"
          fi

  tag-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' "$VERSION_FILE" | sed -E 's/version *= *"([^"]+)"/\1/')
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists at $tag_sha, but this push is $GITHUB_SHA - two merges landed with the same version. Bump the version again rather than retagging."
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged and released; nothing to do."
              exit 0
            fi
            echo "$tag exists on this commit but has no release yet; creating the release."
          fi

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --target "$GITHUB_SHA"
